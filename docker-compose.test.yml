services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scos_test
      POSTGRES_PASSWORD: scos_test
      POSTGRES_DB: scos_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scos_test"]
      interval: 2s
      timeout: 5s
      retries: 10
