# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: scos-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Deploys are triggered by the CI deploy job once tests pass.
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scos-db
          property: connectionString
      - key: LOG_LEVEL
        value: info

databases:
  - name: scos-db
    plan: free
    region: singapore
    databaseName: scos
    user: scos
    postgresMajorVersion: "16"
